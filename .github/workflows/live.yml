name: Live console
# Every morning: rebuild the 60-day simulated window ending yesterday, inject the day's random faults, run the
# dbt checks, score them against the injections and publish site/data/status.json for the live page.
on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Simulate, check and score
        run: python scripts/live.py
      - name: Commit the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "live console $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
